name: publish

# Builds and publishes both images to GitHub Container Registry:
#
#   ghcr.io/<owner>/music-seer:latest          the web app
#   ghcr.io/<owner>/music-seer-ytdlp:latest    the yt-dlp worker
#
# Those are exactly the names docker-compose.arrstack.yml defaults to, so a host
# only ever needs to `docker compose pull`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: typecheck, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: End-to-end suite
        # Runs the built standalone server against a mock Lidarr, with the
        # download path disabled. The MusicBrainz check inside it is soft.
        run: node scripts/e2e.mjs

  images:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: music-seer
            dockerfile: Dockerfile
          - name: music-seer-ytdlp
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository name, and GitHub usernames are not.
      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages default to private even from a public repository, which
      # means every host needs a token to pull. Try to make it public so
      # `docker compose pull` works anonymously. Needs a token with package
      # write access; if this cannot do it, flip it once in the package
      # settings (Package settings -> Change visibility) and it stays that way.
      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "user/packages/container/${{ matrix.name }}" -f visibility=public \
            && echo "package ${{ matrix.name }} is public" \
            || echo "could not set visibility for ${{ matrix.name }} — set it manually in the package settings"
